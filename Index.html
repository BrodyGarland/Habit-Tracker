<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>My Habit Tracker</h1>


    <section id="stats">
        <p>Today's Completion: <span id="percentage">0%</span></p>
    </section>


    <section id="chart-area">
        <canvas id="habit-chart"></canvas>
    </section>


    <section id="habits-area">
        <h2>Today's Habits!</h2>


        <input type="text" id="new-habit-input" placeholder="Type a new habit...">

        <select id="category-select">
            <option value="health">Health</option>
            <option value="education">Education</option>
            <option value="fitness">Fitness</option>
            <option value="work">Work</option>
            <option value="tasks">Tasks</option>    
            <option value="other">Other</option> 
        </select>



        <button id="add-habit-button" class="button" >Add Habit</button>
        <button id="backup-button" class="button" >Download Backup</button>

        <ul id="habit-list"></ul>

    </section>
+


    <script src="scirpt.js"></script>
</body>

</html>
