<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Habit Tracker</title>
    <link rel="stylesheet" href="styles.css"
</head>




<body>
    
    <h1>My Habit Tracker</h1>

    <section id="stats">
        <p>Todays Completion: <span id="percentage">0%</span> </p>
    </section>


    <section id="chart-area"?>
        <canvas id="habit-chart"></canvas>
    </section>


    <section id="habits area">
        <h2>Todays Habits!</h2>

        <input type="new-habit-input" placeholder="Type a new habit...">
        <button id="add-a-habit">Add Habit</button>
        <button id="backup-button">Download Backup</button>

        <ul id="habits area"></ul>
    </section>

</body>
</html>
